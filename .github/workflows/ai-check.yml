name: ai-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          shellcheck --version
          python3 --version
          jq --version
      - name: Gate
        run: make check
